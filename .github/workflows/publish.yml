name: Publish verified 52hertz.js release

on:
  push:
    paths:
      - ".transfer/READY"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "b34d4f7d609683b8a520789f9718d4c187d8de464a0b2a1c9b345d2d6047cffd  /tmp/source.zip" | sha256sum --check -

      - name: Replace staging tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/source.zip -d .

      - name: Verify candidate
        run: npm test

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish 52hertz.js 0.2.1"
          git push

      - name: Build release
        run: python tools/build-release.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v0.2.1"             "dist/52hertz.js-0.2.1.zip"             "dist/52hertz.js-0.2.1.zip.sha256"             --target main             --title "52hertz.js 0.2.1"             --notes "Deterministic shared-clock radio playout as a standalone, dependency-free ESM primitive."
