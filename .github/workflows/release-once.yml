name: Create verified release

on:
  push:
    paths:
      - ".release/READY"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact clean target
        shell: bash
        run: |
          set -euo pipefail
          git checkout "d3c45603d687436d9b6d1dfdccecf8c5b3a100e0"
          python tools/build-release.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v0.2.1" \
            "dist/52hertz.js-0.2.1.zip" \
            "dist/52hertz.js-0.2.1.zip.sha256" \
            --target "d3c45603d687436d9b6d1dfdccecf8c5b3a100e0" \
            --title "52hertz.js 0.2.1" \
            --notes "Deterministic shared-clock radio playout as a standalone, dependency-free ESM primitive."
