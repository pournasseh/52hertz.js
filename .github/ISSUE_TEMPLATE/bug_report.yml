name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest reproducible example and what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, browser/runtime, host/server, and relevant configuration.
    validations:
      required: true
